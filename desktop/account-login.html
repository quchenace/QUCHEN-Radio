<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 QuChen 账号</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1d4e6b 0%, #0d1420 55%, #070b12 100%);
    color: #e8eef6;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .wrap { width: 100%; max-width: 380px; padding: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #47d1a0; box-shadow: 0 0 14px #47d1a0aa; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .5px; }
  .sub { font-size: 12.5px; color: #8ea3b8; margin: 4px 0 22px; }
  label { display: block; font-size: 12.5px; color: #9fb2c6; margin: 0 0 6px; }
  input {
    width: 100%; padding: 11px 12px; font-size: 14px; color: #e8eef6;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.13);
    border-radius: 9px; outline: none; transition: border-color .15s, background .15s;
  }
  input:focus { border-color: #47d1a0; background: rgba(71,209,160,.08); }
  .field { margin-bottom: 14px; }
  button.primary {
    width: 100%; margin-top: 6px; padding: 11px 12px; font-size: 14.5px; font-weight: 600;
    color: #05221a; background: linear-gradient(180deg, #63e3b3, #37c795);
    border: 0; border-radius: 9px; cursor: pointer; transition: filter .15s, transform .06s;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { filter: grayscale(.45); cursor: default; }
  .msg { min-height: 18px; font-size: 12.5px; margin: 12px 0 0; line-height: 1.5; }
  .msg.err { color: #ff8f8f; }
  .msg.ok { color: #7fe3bb; }
  .msg.warn { color: #ffcf7a; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 12px; color: #7d90a4; }
  .foot button {
    background: none; border: 0; color: #7d90a4; font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  }
  .foot button:hover { color: #cfe0f0; background: rgba(255,255,255,.06); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #05221a55; border-top-color: #05221a; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span><h1>QUCHEN Radio</h1></div>
  <p class="sub">未登录不加载主界面。使用 QuChen 账号进入。</p>

  <div id="qcTabs" style="display:flex;gap:6px;margin:0 0 14px;background:#0f131a;border:1px solid #232a36;border-radius:11px;padding:4px">
  <button id="tabLogin" type="button" style="flex:1;padding:9px 0;border:0;border-radius:8px;background:#1d2534;color:#e8ecf2;font:14px/1 inherit;font-weight:600;cursor:pointer">登录</button>
  <button id="tabRegister" type="button" style="flex:1;padding:9px 0;border:0;border-radius:8px;background:transparent;color:#8b93a3;font:14px/1 inherit;cursor:pointer">注册</button>
</div>
<form id="form" autocomplete="off">
    <div class="field">
      <label for="email">邮箱</label>
      <input id="email" type="email" placeholder="you@example.com" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="••••••••" required>
    </div>
    <button id="submit" class="primary" type="submit">登录</button>
  </form>
<div id="qcRegPane" style="display:none">
  <div style="margin:2px 0 14px;font-size:12.5px;line-height:1.65;color:#8b93a3">
    用邮箱注册 QuChen 账号，一个账号可在曲辰套件各端登录。
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <input id="regEmail" type="email" placeholder="you@example.com" spellcheck="false" autocomplete="username"
      style="flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid #2a3140;background:#0f131a;color:#e8ecf2;font:15px/1.4 inherit;outline:none">
    <button id="regSend" type="button"
      style="white-space:nowrap;padding:12px 14px;border-radius:10px;border:1px solid #2d6bd6;background:#152238;color:#9dc0ff;font:14px/1 inherit;cursor:pointer">获取验证码</button>
  </div>
  <input id="regCode" type="text" inputmode="numeric" maxlength="6" placeholder="邮箱验证码（6 位）" autocomplete="one-time-code"
    style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid #2a3140;background:#0f131a;color:#e8ecf2;font:15px/1.4 inherit;outline:none">
  <input id="regPassword" type="password" placeholder="设置密码（至少 8 位）" autocomplete="new-password"
    style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid #2a3140;background:#0f131a;color:#e8ecf2;font:15px/1.4 inherit;outline:none">
  <input id="regPassword2" type="password" placeholder="再输一次密码" autocomplete="new-password"
    style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid #2a3140;background:#0f131a;color:#e8ecf2;font:15px/1.4 inherit;outline:none">
  <button id="regSubmit" type="button"
    style="width:100%;margin-top:14px;padding:12px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#4d8dff,#3f7aee);color:#fff;font:15px/1 inherit;font-weight:600;cursor:pointer">注册账号</button>
</div>

<p style="margin-top:12px;font-size:12px;color:#7d8595;text-align:center">忘记密码？<a href="https://frp-any.com:19549/login.html#reset" target="_blank" rel="noopener" style="color:#6aa2ff;text-decoration:none;margin-left:2px">到官网账号中心重置</a></p>


  <p id="msg" class="msg"></p>

  <div class="foot">
    <span id="hint">账号服务 frp-any.com:19549</span>
    <button id="quit" type="button">退出</button>
  </div>
</div>
<script>
(function () {
  const form = document.getElementById('form');
  const btn = document.getElementById('submit');
  const msg = document.getElementById('msg');
  const hint = document.getElementById('hint');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const api = window.quchenAccount || null;

  function show(text, kind) {
    msg.textContent = text || '';
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }
  function busy(on) {
    btn.disabled = on;
    btn.innerHTML = on ? '<span class="spin"></span>正在登录' : '登录';
  }

  async function bootstrap() {
    if (!api) { show('登录窗初始化失败：preload 未加载。', 'err'); return; }
    try {
      const st = await api.state();
      if (st && st.email) email.value = st.email;
      if (st && st.unlocked) { show('已有有效会话，正在进入…', 'ok'); return; }
      if (st && st.why === 'grace_expired') {
        show('离线凭证已超过 7 天，请重新登录。', 'warn');
      } else if (st && st.why === 'revoked') {
        show('该设备的登录已在别处失效，请重新登录。', 'warn');
      }
    } catch (e) {
      show('无法读取本地会话：' + (e && e.message || e), 'err');
    }
    setTimeout(function () { (email.value ? password : email).focus(); }, 60);
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!api) return;
    const e = email.value.trim();
    const p = password.value;
    if (!e || !p) { show('请填写邮箱与密码。', 'err'); return; }
    busy(true);
    show('正在验证…');
    try {
      const res = await api.login(e, p);
      if (res && res.ok) {
        show('登录成功，正在进入…', 'ok');
        return;
      }
      const code = (res && res.code) || 'login_failed';
      const map = {
        bad_credentials: '邮箱或密码不正确。',
        pending_approval: '账号待管理员审批，通过后即可登录。',
        rejected: '注册申请未通过，请联系管理员。',
        banned: '账号已被停用，请联系管理员。',
        locked: '尝试次数过多，请稍后再试。',
        unreachable: '连不上账号服务（frp-any.com:19549），请确认服务已启动。',
        bad_request: '请填写有效的邮箱与密码。',
      };
      show(map[code] || (res && res.message) || '登录失败，请重试。', 'err');
    } catch (err) {
      show('登录异常：' + (err && err.message || err), 'err');
    } finally {
      busy(false);
    }
  });

  document.getElementById('quit').addEventListener('click', function () {
    if (api) api.quit();
  });

  bootstrap();
})();

/* ===== QuChen 注册视图：登录 / 注册切换 + 邮箱验证码注册 ===== */
(function () {
  var API = window.quchenAccount;
  var pane = document.getElementById('qcRegPane');
  var tabLogin = document.getElementById('tabLogin');
  var tabRegister = document.getElementById('tabRegister');
  if (!pane || !tabLogin || !tabRegister) return;

  function show(text, kind) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.textContent = text || '';
    if (m.className !== undefined) m.className = 'msg' + (kind ? ' ' + kind : '');
    m.style.color = kind === 'err' ? '#ff6b6b' : kind === 'ok' ? '#3ecf8e' : kind === 'warn' ? '#f0b34a' : '';
  }
  function val(id) {
    var el = document.getElementById(id);
    return el ? String(el.value || '').trim() : '';
  }
  function host(el) {
    if (!el) return null;
    return (el.closest && el.closest('.field')) || el;
  }
  function paint(mode) {
    var reg = mode === 'register';
    ['email', 'password', 'submit'].forEach(function (id) {
      var el = document.getElementById(id);
      var h = host(el);
      if (h) h.style.display = reg ? 'none' : '';
    });
    /* 邮箱/密码的 <label> 与 input 平级，切到注册视图时一并隐藏 */
    var lab = document.querySelectorAll('label[for="email"], label[for="password"]');
    for (var i = 0; i < lab.length; i++) lab[i].style.display = reg ? 'none' : '';
    pane.style.display = reg ? '' : 'none';
    tabLogin.style.background = reg ? 'transparent' : '#1d2534';
    tabLogin.style.color = reg ? '#8b93a3' : '#e8ecf2';
    tabLogin.style.fontWeight = reg ? '400' : '600';
    tabRegister.style.background = reg ? '#1d2534' : 'transparent';
    tabRegister.style.color = reg ? '#e8ecf2' : '#8b93a3';
    tabRegister.style.fontWeight = reg ? '600' : '400';
    var focus = document.getElementById(reg ? 'regEmail' : 'email');
    if (focus) { try { focus.focus(); } catch (e) {} }
    if (!reg) show('');
  }
  tabLogin.addEventListener('click', function () { paint('login'); });
  tabRegister.addEventListener('click', function () { paint('register'); });
  paint('login');

  function codeMap(res) {
    var code = (res && (res.code || res.code === '' ? res.code : '')) || '';
    if (!code && res && typeof res === 'object') code = String(res.code || '');
    var map = {
      email_taken: '该邮箱已注册，请直接登录或找回密码。',
      no_code: '请先获取验证码。',
      code_expired: '验证码已过期，请重新获取。',
      code_wrong: '验证码不正确，请检查后重试。',
      code_locked: '验证码错误次数过多，请重新获取。',
      too_soon: '发送太频繁，请稍后再试。',
      smtp_failed: '验证码邮件发送失败，请稍后重试。',
      bad_request: '请检查填写内容。',
      unreachable: '连不上账号服务，请确认网络或服务已启动。',
      forbidden: '非法调用来源。',
      weak_password: '密码需 8-128 位，请重新设置。',
      pending_approval: '账号待管理员审批，通过后即可登录。',
      bad_credentials: '邮箱或密码不正确。',
      locked: '密码错误次数过多，请稍后再试或重置密码。',
      too_many_devices: '设备数已达上限，请先在账号中心移出旧设备。'
    };
    if (map[code]) return map[code];
    return (res && res.message) || '操作失败，请重试。';
  }

  var sendBtn = document.getElementById('regSend');
  var left = 0;
  var timer = null;
  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
    left = 0;
    if (sendBtn) {
      sendBtn.disabled = false;
      sendBtn.style.opacity = '1';
      sendBtn.textContent = '获取验证码';
    }
  }
  function tick() {
    left -= 1;
    if (left <= 0) { stopTimer(); return; }
    sendBtn.textContent = left + ' 秒后重发';
  }
  if (sendBtn) {
    sendBtn.addEventListener('click', function () {
      var email = val('regEmail');
      if (!email) { show('请先填写邮箱。', 'err'); var e = document.getElementById('regEmail'); if (e) e.focus(); return; }
      if (!API || !API.sendCode) { show('登录窗初始化失败：桥接未加载。', 'err'); return; }
      sendBtn.disabled = true;
      sendBtn.style.opacity = '.6';
      sendBtn.textContent = '发送中…';
      Promise.resolve(API.sendCode(email, 'register')).then(function (res) {
        if (res && res.ok) {
          left = Math.max(30, Number(res.resend_after) || 60);
          if (timer) clearInterval(timer);
          timer = setInterval(tick, 1000);
          sendBtn.disabled = true;
          sendBtn.style.opacity = '.6';
          show(res.message || '验证码已发送，10 分钟内有效。', 'ok');
          var c = document.getElementById('regCode');
          if (c) c.focus();
        } else {
          stopTimer();
          show(codeMap(res), 'err');
        }
      }).catch(function (err) {
        stopTimer();
        show('验证码发送失败：' + ((err && err.message) || err), 'err');
      });
    });
  }

  var submit = document.getElementById('regSubmit');
  function finish(msg, kind) {
    if (submit) { submit.disabled = false; submit.textContent = '注册账号'; }
    show(msg, kind);
  }
  if (submit) {
    submit.addEventListener('click', function () {
      var email = val('regEmail');
      var code = val('regCode');
      var pwd = val('regPassword');
      var pwd2 = val('regPassword2');
      if (!email) { show('请填写邮箱。', 'err'); return; }
      if (!/^\d{6}$/.test(code)) { show('请填写邮箱收到的 6 位验证码。', 'err'); return; }
      if (pwd.length < 8) { show('密码至少 8 位。', 'err'); return; }
      if (pwd !== pwd2) { show('两次输入的密码不一致。', 'err'); return; }
      if (!API || !API.register) { show('登录窗初始化失败：桥接未加载。', 'err'); return; }
      submit.disabled = true;
      submit.textContent = '注册中…';
      Promise.resolve(API.register(email, code, pwd)).then(function (res) {
        if (!res || !res.ok) { finish(codeMap(res), 'err'); return; }
        if (res.status === 'active') {
          show('注册成功，正在登录…', 'ok');
          return Promise.resolve(API.login(email, pwd)).then(function (r) {
            if (r && r.ok) { show('登录成功，正在进入…', 'ok'); return; }
            finish('注册成功，请用该邮箱登录。', 'warn');
          }).catch(function (err) {
            finish('注册成功，请用该邮箱登录。', 'warn');
          });
        }
        finish(res.message || '注册成功，等待管理员审批后即可登录。', 'ok');
      }).catch(function (err) {
        finish('注册失败：' + ((err && err.message) || err), 'err');
      });
    });
  }
})();

</script>
</body>
</html>
